<div class="modal-header">
  <h3>{{ file.name }}</h3>
</div>

<div class="modal-body">
  <!-- 显示PDF生成状态 -->
  <div class="text-center" ng-show="isGeneratingPDF">
    <div class="alert alert-info">
      <span class="fas fa-circle-notch fa-spin"></span>
      {{ generatingStatus }}
    </div>
  </div>

  <!-- 显示错误信息 -->
  <div class="alert alert-danger" ng-show="translationError">
    {{ translationError }}
  </div>

  <!-- 标准预览 -->
  <div class="text-center" style="position: relative;">
    <img ng-src="../api/file/{{ file.id }}/data?size=web"
         ng-init="error = false"
         img-error="error = true"
         ng-show="!error && canDisplayPreview()" />

    <!-- PDF预览 -->
    <iframe ng-src="{{ trustedFileUrl }}" class="pdf-viewer" scrolling="yes" ng-if="!error && file.mimetype == 'application/pdf'"></iframe>

    <!-- 文件未找到 -->
    <p class="well-lg" ng-show="error">
      <span class="fas fa-exclamation-triangle"></span>
      {{ 'file.view.not_found' | translate }}
    </p>
  </div>
</div>

<div class="modal-footer">
  <div class="pull-left">
    <button type="button" class="btn btn-default" ng-click="translateToChinese()" ng-disabled="isGeneratingPDF">
      <span class="fas fa-language"></span> 翻译成中文
    </button>
  </div>
  
  <div class="pull-right">
    <button type="button" class="btn btn-default" ng-click="printFile()">
      <span class="fas fa-print"></span>
    </button>
    <button type="button" class="btn btn-default" ng-click="openFile()">
      <span class="fas fa-download"></span>
    </button>
    <button type="button" class="btn btn-default" ng-click="closeFile()">
      <span class="fas fa-times"></span>
    </button>
  </div>
</div>
