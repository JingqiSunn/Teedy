<div class="container">
  <div class="col-md-4 col-md-offset-4">
    <div class="well">
      <form name="registerForm" novalidate ng-submit="register()">
        <h2>Register New Account</h2>
        
        <div class="form-group" ng-class="{ 'has-error': registerForm.username.$invalid && registerForm.username.$dirty }">
          <input type="text" id="inputUsername" name="username" required placeholder="Username"
                 class="form-control" ng-model="user.username" />
        </div>

        <div class="form-group" ng-class="{ 'has-error': (registerForm.email.$invalid || registerForm.email.$error.format) && registerForm.email.$dirty }">
          <input type="email" id="inputEmail" name="email" required placeholder="Email"
                 class="form-control" ng-model="user.email" />
        </div>

        <div class="form-group" ng-class="{ 'has-error': registerForm.password.$invalid && registerForm.password.$dirty }">
          <input type="password" id="inputPassword" name="password" required placeholder="Password"
                 class="form-control" ng-model="user.password" />
        </div>

        <div class="form-group" ng-class="{ 'has-error': (registerForm.confirmPassword.$invalid || registerForm.confirmPassword.$error.match) && registerForm.confirmPassword.$dirty }">
          <input type="password" id="inputConfirmPassword" name="confirmPassword" required placeholder="Confirm Password"
                 class="form-control" ng-model="user.confirmPassword" />
        </div>

        <button type="submit" class="btn btn-primary btn-block" 
                ng-disabled="registerForm.$invalid || !user.email || !user.password || !user.confirmPassword || user.password !== user.confirmPassword">
          Register
        </button>

        <div class="text-center" style="margin-top: 15px;">
          Already have an account? <a href="#/login">Login now</a>
        </div>
      </form>
    </div>
  </div>
</div>
